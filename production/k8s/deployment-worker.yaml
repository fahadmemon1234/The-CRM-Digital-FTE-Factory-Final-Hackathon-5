# TechCorp Customer Success AI Agent - Message Processor Deployment
#
# Kubernetes Deployment for the Kafka message processor worker.
#
# INCUBATION MAPPING:
# -------------------
# Incubation: Local Python script execution
# Production: Kubernetes Deployment with multiple replicas for scalability
#
# Usage:
#   kubectl apply -f deployment-worker.yaml
#   kubectl get deployments -n customer-success-fte
#   kubectl get pods -n customer-success-fte -l component=message-processor
#
# Author: AI Engineering Team
# Version: 1.0.0 (Production)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fte-message-processor
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
    component: message-processor
    version: v2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer-success-fte
      component: message-processor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: customer-success-fte
        component: message-processor
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: fte-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: fte-message-processor
          image: your-registry/customer-success-fte:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - production.workers.message_processor
          envFrom:
            - configMapRef:
                name: fte-config
            - secretRef:
                name: fte-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import asyncio; from production.workers.message_processor import UnifiedMessageProcessor; print('OK')
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import asyncio; from production.workers.message_processor import UnifiedMessageProcessor; print('OK')
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: customer-success-fte
                    component: message-processor
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
