# TechCorp Customer Success AI Agent - Kubernetes Service
#
# Kubernetes Service for exposing the FTE API.
#
# INCUBATION MAPPING:
# -------------------
# Incubation: Direct localhost access
# Production: Kubernetes Service for internal cluster communication
#
# Usage:
#   kubectl apply -f service.yaml
#   kubectl get services -n customer-success-fte
#   kubectl port-forward svc/customer-success-fte 8000:80 -n customer-success-fte
#
# Author: AI Engineering Team
# Version: 1.0.0 (Production)

apiVersion: v1
kind: Service
metadata:
  name: customer-success-fte
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
    component: api
  annotations:
    description: "Service for Customer Success FTE API"
spec:
  type: ClusterIP
  selector:
    app: customer-success-fte
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  sessionAffinity: None
